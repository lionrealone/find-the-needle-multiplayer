<!doctype html>
<html lang="en">
  <head>
    <meta name="author" content="lionrealone" />
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find The Needle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg-orb a"></div>
      <div class="bg-orb b"></div>
    </div>
    <main class="shell">
      <h1>FIND THE NEEDLE</h1>
      <p class="credit">made with &lt;3 by lionrealone</p>
      <p class="lede"></p>
      <button class="cta" id="btnStart" type="button"></button>
      <div class="actions" id="actions" hidden>
        <button class="link" id="btnPick" type="button"></button>
        <button class="link" id="btnSteam" type="button"></button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
